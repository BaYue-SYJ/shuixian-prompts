<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouMind 原图库 · Prompt Gallery</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:#0B0E14;color:#EAEAF0;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 20% 15%,rgba(0,229,255,.10),transparent 45%),radial-gradient(ellipse at 80% 30%,rgba(168,108,213,.10),transparent 45%),radial-gradient(ellipse at 50% 85%,rgba(233,69,96,.08),transparent 50%)}
.container{max-width:1200px;margin:0 auto;padding:60px 32px;position:relative;z-index:1}
.header{text-align:center;margin-bottom:56px}
.header-badge{display:inline-block;padding:6px 20px;border:1px solid rgba(234,234,240,.2);border-radius:30px;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:rgba(234,234,240,.6);letter-spacing:.15em;margin-bottom:24px}
.header-title{font-family:'Noto Serif SC',serif;font-size:clamp(38px,6vw,68px);font-weight:900;line-height:1.1;margin-bottom:16px;background:linear-gradient(135deg,#00E5FF 0%,#A06CD5 50%,#E94560 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-sub{font-size:18px;font-weight:300;color:rgba(234,234,240,.55);margin-bottom:8px}
.header-stats{display:flex;gap:40px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.header-stat-num{font-family:'Space Mono',monospace;font-size:30px;font-weight:700;color:#EAEAF0}
.header-stat-label{font-size:12px;color:rgba(234,234,240,.4);margin-top:4px}
.back-link{display:inline-block;margin-bottom:28px;color:rgba(234,234,240,.5);text-decoration:none;font-size:13px;border:1px solid rgba(234,234,240,.15);padding:8px 18px;border-radius:20px;transition:all .3s}
.back-link:hover{color:#fff;border-color:rgba(234,234,240,.4)}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.card{text-decoration:none;border-radius:16px;padding:34px 30px;position:relative;overflow:hidden;transition:all .4s;border:1px solid rgba(234,234,240,.08);background:rgba(255,255,255,.03)}
.card:hover{transform:translateY(-6px);border-color:rgba(0,229,255,.4);box-shadow:0 20px 60px rgba(0,229,255,.12)}
.card-num{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;opacity:.45;margin-bottom:14px}
.card-title{font-family:'Noto Serif SC',serif;font-size:26px;font-weight:900;margin-bottom:8px;color:#EAEAF0}
.card-sub{font-size:14px;font-weight:300;color:rgba(234,234,240,.5);margin-bottom:18px}
.card-meta{display:flex;gap:16px;padding-top:16px;border-top:1px solid rgba(234,234,240,.08)}
.card-meta-num{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:#00E5FF}
.card-meta-label{font-size:11px;color:rgba(234,234,240,.35);margin-top:2px}
.card-arrow{position:absolute;bottom:30px;right:30px;font-size:20px;opacity:.3;transition:all .3s}
.card:hover .card-arrow{opacity:.8;transform:translateX(4px)}
.footer{text-align:center;padding:40px 0 20px;margin-top:40px;color:rgba(234,234,240,.3);font-size:13px;font-family:'Space Mono',monospace}
@media(max-width:640px){.container{padding:40px 20px}.gallery-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-link">← 返回风格图鉴总览</a>
  <div class="header">
    <div class="header-badge">YOUMIND · ORIGINAL IMAGES</div>
    <h1 class="header-title">YouMind 原图库</h1>
    <p class="header-sub">来自 YouMind 的全量原图提示词 · 按平台分类</p>
    <div class="header-stats">
      <div class="header-stat"><div class="header-stat-num">3</div><div class="header-stat-label">提示词总数</div></div>
      <div class="header-stat"><div class="header-stat-num">3</div><div class="header-stat-label">原图总数</div></div>
      <div class="header-stat"><div class="header-stat-num">2</div><div class="header-stat-label">分类数</div></div>
    </div>
  </div>
  <div class="gallery-grid">
    <a href="youmind_anime_manga.html" class="card">
      <div class="card-num">YOUMIND · anime-manga</div>
      <div class="card-title">动漫二次元</div>
      <div class="card-meta">
        <div class="card-meta-item"><div class="card-meta-num">2</div><div class="card-meta-label">提示词</div></div>
        <div class="card-meta-item"><div class="card-meta-num">2</div><div class="card-meta-label">原图</div></div>
      </div>
      <div class="card-arrow">→</div>
    </a>
    <a href="youmind_cyberpunk_sci_fi.html" class="card">
      <div class="card-num">YOUMIND · cyberpunk-sci-fi</div>
      <div class="card-title">赛博科幻</div>
      <div class="card-meta">
        <div class="card-meta-item"><div class="card-meta-num">1</div><div class="card-meta-label">提示词</div></div>
        <div class="card-meta-item"><div class="card-meta-num">1</div><div class="card-meta-label">原图</div></div>
      </div>
      <div class="card-arrow">→</div>
    </a>
  </div>
  <div class="footer">YOUMIND GALLERY · 原图由 youmind_scraper.py 自动构建</div>
</div>
</body>
</html>
