<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛博科幻 · YouMind 原图库</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:#0B0E14;color:#EAEAF0;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 15% 20%,rgba(0,229,255,.12),transparent 45%),radial-gradient(ellipse at 85% 35%,rgba(168,108,213,.10),transparent 45%),radial-gradient(ellipse at 50% 80%,rgba(233,69,96,.08),transparent 50%)}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:14px 32px;background:rgba(11,14,20,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,229,255,.15)}
.nav-brand{font-weight:900;font-size:15px;color:#EAEAF0;letter-spacing:.05em}
.nav-brand span{color:#00E5FF}
.nav-links a{text-decoration:none;font-size:12px;font-weight:500;padding:5px 12px;border-radius:20px;color:#EAEAF0;opacity:.55;transition:all .3s}
.nav-links a:hover{opacity:1;background:rgba(0,229,255,.12)}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;padding:80px 32px 60px;text-align:center}
.hero-inner{position:relative;z-index:2;max-width:900px}
.hero-badge{display:inline-block;padding:6px 20px;border-radius:30px;background:linear-gradient(135deg,#00E5FF,#A06CD5);color:#0B0E14;font-size:13px;font-weight:700;letter-spacing:.15em;margin-bottom:28px}
.hero-title{font-family:'Noto Serif SC',serif;font-size:clamp(44px,7vw,84px);font-weight:900;line-height:1.1;background:linear-gradient(135deg,#EAEAF0 0%,#A06CD5 50%,#00E5FF 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:18px}
.hero-sub{font-size:clamp(18px,2.5vw,24px);font-weight:300;color:#EAEAF0;opacity:.7;margin-bottom:40px}
.hero-stats{display:flex;gap:40px;justify-content:center;flex-wrap:wrap}
.stat{text-align:center;padding:16px 24px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(0,229,255,.15);box-shadow:0 8px 32px rgba(0,0,0,.3);transition:all .3s;cursor:pointer}
.stat:hover{transform:translateY(-3px);border-color:#00E5FF;box-shadow:0 12px 30px rgba(0,229,255,.15)}
.stat-num{font-family:'Noto Serif SC',serif;font-size:42px;font-weight:900;color:#00E5FF;line-height:1}
.stat-label{font-size:12px;font-weight:500;color:#EAEAF0;opacity:.5;margin-top:6px;letter-spacing:.1em}
.stat-hint{font-size:10px;color:#EAEAF0;opacity:.25;margin-top:4px}
.desc{max-width:820px;margin:0 auto;padding:0 32px 80px;font-size:16px;line-height:1.9;color:#EAEAF0;opacity:.75}
.footer{text-align:center;padding:40px 32px;border-top:1px solid rgba(234,234,240,.08);color:rgba(234,234,240,.35);font-size:12px}
.footer-nav{display:flex;justify-content:center;gap:16px;margin-top:14px;flex-wrap:wrap}
.footer-nav a{font-size:12px;text-decoration:none;color:#EAEAF0;opacity:.5;transition:opacity .3s}
.footer-nav a:hover{opacity:1;color:#00E5FF}
@media(max-width:640px){.nav{padding:10px 16px}.hero-stats{gap:24px}.stat-num{font-size:32px}}
</style>
</head>
<body data-category="youmind/cyberpunk_sci_fi" data-category-name="赛博科幻">
<nav class="nav">
  <div class="nav-brand">YouMind 原图库 · <span>Prompt Gallery</span></div>
  <div class="nav-links">
    <a href="youmind.html">分类总览</a>
    <a href="index.html">风格图鉴</a>
  </div>
</nav>
<section class="hero">
  <div class="hero-inner">
    <div class="hero-badge">cyberpunk-sci-fi</div>
    <h1 class="hero-title">赛博科幻</h1>
    <p class="hero-sub">YouMind 平台「赛博科幻」分类的原图提示词合集</p>
    <div class="hero-stats" id="openGalleryBtn">
      <div class="stat"><div class="stat-num">1</div><div class="stat-label">提示词条目</div><div class="stat-hint">点击查看全部</div></div>
      <div class="stat"><div class="stat-num">1</div><div class="stat-label">原图数量</div></div>
    </div>
  </div>
</section>
<div class="desc">
  本页所有提示词与配图均来自 YouMind 平台，图片为 <strong>media 原图</strong>(非缩略图)。点击上方数字即可弹出全部分类条目，支持搜索与排序；点击任意卡片可查看完整提示词并一键复制。
</div>
<footer class="footer">
  <p>YouMind 原图库 · 分类 赛博科幻</p>
  <div class="footer-nav">
    <a href="youmind.html">分类总览</a>
    <a href="index.html">风格图鉴</a>
  </div>
</footer>
<script src="gallery-overlay.js"></script>
</body>
</html>
