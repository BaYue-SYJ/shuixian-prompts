<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全部分类 · 水仙的AI提示词</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://r2.qqsrc.com" crossorigin>
<link rel="dns-prefetch" href="https://r2.qqsrc.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css?v=17">
<link rel="stylesheet" href="css/features.css?v=17">
<style>
.maj-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow-sm);margin-bottom:20px}
.maj-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.maj-head .cico{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:26px}
.maj-head h3{font-family:var(--serif);font-size:22px;margin:0;font-weight:900}
.maj-head .cnt{color:var(--muted);font-weight:600;font-size:14px;margin-left:auto}
.subchips{display:flex;flex-wrap:wrap;gap:9px}
.subchips a{padding:8px 15px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);
  font-size:13.5px;font-weight:600;color:var(--ink-2);transition:.16s}
.subchips a:hover{background:var(--garden-050);color:var(--garden);border-color:var(--garden);transform:translateY(-1px)}
.subchips a .n{color:var(--muted);font-weight:500;margin-left:5px}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2C8CAB">
</head>
<body data-page="categories">
<main>
  <div class="page-head"><div class="shell">
    <p data-i18n="cat_eyebrow" class="eyebrow">All Categories</p>
    <h1 data-i18n="cat_h1">分类总览</h1>
    <p class="sub" data-i18n="cat_sub">12 大分类、79 个小类，共 5,430 条提示词。点任意小类即可进入对应画廊。</p>
  </div></div>

  <div class="shell" id="catOverview"></div>
</main>
<script src="js/base.js?v=17"></script>
<script src="js/i18n.js?v=17"></script>
<script src="js/features.js?v=17"></script>
<script>
App.init({ page:'categories', onReady:function(){
  const D = App.D;
  const EMOJI = {'（大凶）':'🔥','人物写真':'👤','其他/未归类':'🗂️','随手拍':'📸','动漫二次元':'🌸','产品电商':'🛍️','海报广告':'🖼️','插画艺术':'🎨','车辆机械3D':'🚗','游戏':'🎮','建筑空间场景':'🏛️','晓兰':'🌿'};
  $('#catOverview').innerHTML = D.majors.map(m => {
    const { bg, main } = App.catColor(m.name);
    const chips = m.subs.map(s => `<a href="gallery.html?cat=${encodeURIComponent(s.name)}" style="--cc:${main}">${FX.esc(FX.catName(s.name))}<span class="n">${s.count}</span></a>`).join('');
    return `<section class="maj-block">
      <div class="maj-head">
        <span class="cico" style="background:${bg}">${EMOJI[m.name] || '📁'}</span>
        <h3>${FX.esc(FX.catName(m.name))}</h3><span class="cnt">${FX.esc(FX.tf('cat_major_meta', { n: m.count, sub: m.subs.length }))}</span>
      </div>
      <div class="subchips">${chips}</div>
    </section>`;
  }).join('');
}});
</script>
</body>
</html>
