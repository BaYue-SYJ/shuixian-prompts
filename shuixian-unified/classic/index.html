<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水仙的AI提示词</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://r2.qqsrc.com" crossorigin>
  <link rel="dns-prefetch" href="https://r2.qqsrc.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,500;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css?v=38">
<link rel="stylesheet" href="css/features-classic.css?v=38">
<style>
/* ===== 首页 Hero ===== */
.hero{
  background:var(--blue-soft);padding:72px 48px 56px;
  position:relative;overflow:hidden;
}
.hero::before{content:'';position:absolute;top:-140px;left:50%;transform:translateX(-50%);
  width:760px;height:760px;border-radius:50%;
  background:radial-gradient(circle,rgba(44,140,171,.10) 0%,transparent 68%);pointer-events:none}
.hero::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(44,140,171,.08) 1px,transparent 1.4px);
  background-size:20px 20px;
  -webkit-mask:radial-gradient(circle at 50% 38%,rgba(0,0,0,1),transparent 72%);
  mask:radial-gradient(circle at 50% 38%,rgba(0,0,0,1),transparent 72%)}
.hero-inner{max-width:1240px;width:100%;margin:0 auto;display:flex;flex-direction:row;gap:48px;align-items:center;position:relative;z-index:1}
.hero-left{flex:1;display:flex;flex-direction:column;gap:24px;min-width:0}
.hero-qr{flex:none;width:220px;display:flex;flex-direction:column;align-items:center;gap:10px}
.hero-qr img{width:100%;height:auto;border-radius:16px;background:var(--white);box-shadow:var(--shadow);display:block}
.hero-qr .qr-label{font-size:13px;color:var(--gray);text-align:center}
.kicker{
  font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;font-size:16px;
  color:var(--blue);letter-spacing:.5px;margin:0;
}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;background:rgba(44,140,171,.08);
  color:#1f6e88;border:1px solid rgba(44,140,171,.16);
  border-radius:999px;padding:7px 18px;font-size:12.5px;font-weight:600;
  letter-spacing:.4px;width:fit-content;
}
.hero-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero h1{margin:0;font-size:48px;font-weight:900;line-height:1.32;color:var(--ink);letter-spacing:.5px}
.hero h1 .accent{color:var(--blue)}
.hero-note{margin:6px 0 0;font-size:15px;color:var(--gray);letter-spacing:.3px}
.hero .sub{margin:0;font-size:16px;font-weight:300;line-height:1.7;color:var(--ink-2);max-width:580px}
.search-bar{
  width:560px;max-width:100%;height:54px;padding:0 20px;border-radius:28px;background:var(--white);
  border:1px solid var(--line);display:flex;align-items:center;gap:12px;
  box-shadow:0 1px 3px rgba(20,25,28,.04),0 6px 14px rgba(20,25,28,.05);
  transition:box-shadow .2s,border-color .2s;
}
.search-bar:focus-within{border-color:var(--blue);box-shadow:0 4px 20px rgba(44,140,171,.15)}
.search-bar svg{flex:none}
.search-bar input{flex:1;border:none;outline:none;font-size:15px;background:transparent;color:var(--ink)}
.search-bar input::placeholder{color:var(--gray-2)}
.search-btn{
  flex:none;display:inline-flex;align-items:center;padding:10px 22px;border-radius:9999px;
  background:linear-gradient(135deg,var(--blue),#3aa3c4);color:var(--white);font-size:14px;font-weight:700;
  letter-spacing:.2px;transition:transform .15s,box-shadow .15s;
}
.search-btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(44,140,171,.35)}

/* 热门搜索描述 */
.hot-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.hot-tag{
  padding:7px 15px;border-radius:999px;background:var(--white);border:1px solid var(--line);
  font-size:13px;font-weight:500;color:var(--gray);cursor:pointer;transition:all .2s;
}
.hot-tag:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-1px)}

/* ===== 精选预览区（真实图片+渐变遮罩）===== */
.featured-section{max-width:1240px;margin:0 auto;padding:48px 32px 32px}
.featured-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;gap:16px;flex-wrap:wrap}
.featured-head h2{font-size:27px;font-weight:900;letter-spacing:-.4px;margin:0;color:var(--ink)}
.featured-head p{color:var(--gray);font-size:14px;margin:4px 0 0;max-width:520px;line-height:1.6}
.refresh-btn{
  flex:none;display:inline-flex;align-items:center;gap:6px;
  padding:9px 18px;border-radius:9999px;background:var(--white);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--gray);cursor:pointer;
  transition:all .2s;white-space:nowrap;
}
.refresh-btn:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-1px)}
.refresh-btn svg{width:15px;height:15px;transition:transform .3s}
.refresh-btn:hover svg{transform:rotate(180deg)}

.featured-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}

.feat-card{
  position:relative;border-radius:18px;overflow:hidden;background:var(--white);
  border:1px solid var(--line);box-shadow:0 1px 3px rgba(20,25,28,.04),0 6px 16px rgba(20,25,28,.05);
  cursor:pointer;transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s;
  display:flex;flex-direction:column;
}
.feat-card:hover{transform:translateY(-6px);box-shadow:0 18px 44px rgba(20,25,28,.12)}

/* 真实图片区域 + 渐变遮罩 */
.feat-thumb{
  height:200px;position:relative;overflow:hidden;display:flex;align-items:flex-end;
  padding:14px 16px;background:#eef2f4;
}
.feat-thumb img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transition:transform .4s ease;
}
.feat-card:hover .feat-thumb img{transform:scale(1.06)}
.feat-thumb .gradient-overlay{
  position:absolute;inset:0;z-index:1;
  pointer-events:none;
}
.feat-thumb .cat-pill{
  position:relative;z-index:2;display:inline-flex;align-items:center;
  background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-radius:999px;padding:5px 13px;font-size:11.5px;font-weight:700;
  color:var(--blue-d,#1f6e88);letter-spacing:.2px;
}

/* 卡片内容 */
.feat-body{padding:14px 16px 17px;display:flex;flex-direction:column;gap:8px;flex:1}
.feat-title{font-size:14.5px;font-weight:700;line-height:1.45;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feat-meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.feat-prompt-preview{font-size:12px;color:var(--gray);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.feat-collect{
  display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--gray);
  cursor:pointer;transition:color .15s;flex:none;
}
.feat-collect:hover{color:#C96B87}
.feat-collect svg{width:13px;height:13px}

/* ===== 全部分类区（手风琴折叠桶）===== */
.cat-section{max-width:1240px;margin:0 auto;padding:48px 32px 32px}
.cat-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;gap:16px;flex-wrap:wrap}
.cat-head h2{font-size:27px;font-weight:900;letter-spacing:-.4px;margin:0;color:var(--ink)}
.cat-head p{color:var(--gray);font-size:14px;margin:4px 0 0;max-width:520px;line-height:1.6}
.cat-head .meta{font-size:13.5px;color:var(--gray);font-weight:600}

/* 统计行 */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px}
.stat-card{background:var(--white);border:1px solid var(--line);border-radius:16px;
  padding:20px 24px;box-shadow:0 1px 3px rgba(20,25,28,.04),0 6px 14px rgba(20,25,28,.05)}
.stat-card .sl{font-size:11.5px;color:var(--gray);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:6px}
.stat-card .sv{font-size:32px;font-weight:900;letter-spacing:-.5px}
.stat-card .sv.teal{color:#2C8CAB}
.stat-card .sv.purple{color:#9B5BC4}
.stat-card .sv.orange{color:#E0892F}
.stat-card .sv.rose{color:#D6607A}

/* 手风琴容器 */
.bucket-grid{display:flex;flex-direction:column;gap:12px}

/* ===== 单个折叠桶（盖子 + 展开内容）===== */
.bucket{
  position:relative;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 1px 3px rgba(20,25,28,.04),0 4px 12px rgba(20,25,28,.04);
  transition:box-shadow .25s, border-color .25s;
}
.bucket:hover{border-color:var(--bc,#2C8CAB);box-shadow:0 4px 20px rgba(20,25,28,.08)}
.bucket.open{border-color:var(--bc,#2C8CAB);box-shadow:0 6px 24px rgba(20,25,28,.10)}

/* ---- 盖子（header）---- */
.bkt-lid{
  display:flex;align-items:center;gap:14px;padding:18px 22px;
  cursor:pointer;user-select:none;
  transition:background .2s;
}
.bkt-lid:hover{background:rgba(44,140,171,.03)}
.bucket.open .bkt-lid{background:rgba(44,140,171,.05)}
.bkt-lid .bkt-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
  background:var(--bt,rgba(44,140,171,.08));flex:none;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.bucket.open .bkt-lid .bkt-ico{transform:scale(1.08)}
.bkt-lid h3{font-size:17px;font-weight:700;letter-spacing:-.2px;margin:0;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bkt-lid .cnt{text-align:right;flex:none;display:flex;align-items:baseline;gap:10px}
.bkt-lid .cnt b{font-size:26px;font-weight:800;line-height:1;color:var(--ink)}
.bkt-lid .cnt span{font-size:11px;color:var(--gray);font-weight:500;white-space:nowrap}

/* 展开/收起箭头 */
.bkt-arrow{
  flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:rgba(20,25,28,.04);transition:transform .35s cubic-bezier(.2,.8,.2,1), background .2s;
  color:var(--gray);font-size:15px;font-weight:700;
}
.bkt-arrow svg{width:14px;height:14px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.bucket.open .bkt-arrow{background:var(--bc,#2C8CAB);color:#fff}
.bucket.open .bkt-arrow svg{transform:rotate(180deg)}

/* 盖子上的提示文字 */
.bkt-hint{
  font-size:11.5px;color:var(--gray);font-weight:600;background:rgba(20,25,28,.05);
  border-radius:999px;padding:4px 12px;white-space:nowrap;flex:none;
  opacity:.75;transition:opacity .2s,color .2s;
}
.bkt-lid:hover .bkt-hint{opacity:1;color:var(--bc,#2C8CAB)}

/* ---- 展开内容区（子分类） ---- */
.bkt-body{
  max-height:0;overflow:hidden;
  transition:max-height .4s cubic-bezier(.2,.8,.2,1);
  border-top:1px solid transparent;
}
.bucket.open .bkt-body{max-height:480px;border-top:1px solid var(--line);overflow-y:auto}
.bkt-inner{padding:16px 22px 20px;display:flex;flex-direction:column;gap:14px}

/* 子类标签行 */
.sub{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.sub span{
  font-size:12px;background:var(--bt,rgba(44,140,171,.07));border:1px solid rgba(44,140,171,.13);
  border-radius:999px;padding:5px 14px;color:var(--ink-2);font-weight:500;white-space:nowrap;
  cursor:pointer;transition:all .2s;
}
.sub span:hover{background:var(--bc,#2C8CAB);color:#fff;border-color:var(--bc,#2C8CAB);transform:translateY(-1px)}
.sub span b{color:var(--ink);font-weight:700;margin-left:4px}
.sub span:hover b{color:#fff}
.sub span.more{opacity:.55;background:transparent;border-style:dashed;cursor:default}
.sub span.more:hover{transform:none;background:transparent;color:inherit;border-color:var(--line)}

/* 底部占比条 */
.bottom{display:flex;align-items:center;gap:12px}
.bar-track{flex:1;height:5px;border-radius:999px;background:rgba(20,25,28,.06);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--bc,#2C8CAB);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bottom .pct{font-size:11px;color:var(--gray);font-weight:600;flex:none}

/* 查看全部按钮 */
.view-all-bar{display:flex;justify-content:center;margin-top:36px}
.view-all-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 32px;border-radius:9999px;
  background:var(--white);border:1px solid var(--line);
  font-size:15px;font-weight:700;color:var(--ink);
  cursor:pointer;transition:all .2s;
  box-shadow:0 1px 3px rgba(20,25,28,.04),0 6px 14px rgba(20,25,28,.05);
}
.view-all-btn:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-2px);box-shadow:0 8px 24px rgba(44,140,171,.15)}
.view-all-btn svg{flex:none}

/* 明细面板（保留但改为内联展开，此面板作为备选） */
#catDetail{margin-top:26px;background:var(--white);border:1px solid var(--line);border-radius:16px;
  padding:32px;box-shadow:0 6px 20px rgba(20,25,28,.08);display:none}
#catDetail.show{display:block;animation:slideUp .35s cubic-bezier(.2,.8,.2,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#catDetail .dh{display:flex;align-items:center;gap:14px;margin-bottom:4px}
#catDetail .dh h3{font-size:24px;font-weight:900;letter-spacing:-.3px}
#catDetail .dh .x{margin-left:auto;cursor:pointer;color:var(--gray);border:1px solid var(--line);
  border-radius:10px;width:34px;height:34px;display:grid;place-items:center;font-size:15px;transition:all .15s}
#catDetail .dh .x:hover{color:var(--blue);border-color:var(--blue);background:rgba(44,140,171,.04)}
#catDetail .dsub{color:var(--ink-2);font-size:15px;margin-bottom:22px;line-height:1.6}
.subgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.subcard{border:1px solid var(--line);border-radius:12px;padding:18px 20px;background:var(--bg,#F7F7F7);
  transition:transform .2s,box-shadow .2s}
.subcard:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(20,25,28,.06)}
.subcard .st{font-weight:700;font-size:15px}
.subcard .sn{font-family:"DM Sans";font-weight:800;font-size:24px;margin-top:8px;color:var(--ink)}
.subcard .sd{font-size:12.5px;color:var(--gray);margin-top:4px}

@media(max-width:1100px){
  .featured-grid{grid-template-columns:repeat(3,1fr)}
  .stats-row{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:920px){
  .hero-inner{flex-direction:column;align-items:flex-start;gap:32px}
  .hero-qr{display:none}
  .featured-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .hero{padding:40px 20px 36px}
  .hero h1{font-size:34px}
  .search-bar{width:100%;height:50px;padding:0 14px;gap:8px}
  .search-bar input{font-size:14px}
  .search-btn{padding:8px 18px;font-size:13px}
  .featured-section,.cat-section{padding:32px 16px 24px}
  .featured-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .featured-head h2,.cat-head h2{font-size:22px}
  .feat-thumb{height:160px}
  .bkt-lid{padding:14px 16px}
  .bkt-lid h3{font-size:15px}
  .bkt-lid .cnt b{font-size:22px}
  .bkt-hint{display:none}
  .sub span{font-size:11px;padding:4px 11px}
}
@media(max-width:480px){
  .hero{padding:32px 16px 28px}
  .hero h1{font-size:28px}
  .hero .sub{font-size:14.5px}
  .search-bar{height:46px;padding:0 12px}
  .featured-grid{grid-template-columns:1fr;gap:12px}
  .stats-row{grid-template-columns:1fr 1fr}
  .feat-thumb{height:180px}
  .bkt-lid{padding:12px 14px;gap:10px}
  .bkt-lid .bkt-ico{width:38px;height:38px;font-size:18px}
  .bkt-arrow{width:28px;height:28px}
}
</style>
</head>
<body data-page="index">
<main>
  <!-- Hero -->
  <section class="hero">
    <div class="hero-inner">
      <div class="hero-left">
        <div class="hero-badge"><span class="dot"></span> 6,011 条精选提示词 · 13 大分类 · 79 个细类</div>
        <p class="kicker">Prompt Garden · 提示词花园</p>
        <h1>水仙的<span class="accent">AI 提示词</span>库<br/>13个大分类，<span class="accent">快来</span>赛图吧!</h1>
        <p class="sub">精选5000多条提示词，按主题分成了 13 个大类、79 个小分类——人物、动漫、海报、插画、产品、游戏等…慢慢逛，总有个提示词适合你。</p>
        <div class="search-bar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#6B6B6B" stroke-width="2"/><path d="M16 16L21 21" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="heroSearch" type="text" placeholder="试试「赛博朋克」「角色立绘」…" autocomplete="off">
          <button class="search-btn" id="heroSearchBtn">搜一下</button>
        </div>
        <!-- 热门搜索描述 -->
        <div class="hot-tags" id="hotTags"></div>
      </div>
      <div class="hero-qr">
        <img src="images/wechat-qr.jpg" alt="水仙的AI提示词 微信公众号">
        <span class="qr-label">扫码关注公众号</span>
      </div>
    </div>
  </section>

  <!-- 全部分类（12 大类桶） -->
  <section class="cat-section" id="cats">
    <div class="cat-head">
      <div>
        <h2>挑个主题逛逛</h2>
        <p>点开任意一栏，就能看里面藏了哪些小分类；看到喜欢的，直接点进去筛选。</p>
      </div>
      <div class="meta" id="catMeta"></div>
    </div>
    <div class="stats-row" id="statsRow"></div>
    <div class="bucket-grid" id="bucketGrid"></div>
    <div id="catDetail">
      <div class="dh">
        <span class="bkt-ico" id="dIco"></span>
        <h3 id="dTitle"></h3>
        <div class="x" id="dClose">✕</div>
      </div>
      <div class="dsub" id="dSub"></div>
      <div class="subgrid" id="dSubgrid"></div>
    </div>
  </section>

  <!-- 精选预览（真实图片+渐变遮罩） -->
  <section class="featured-section">
    <div class="featured-head">
      <div>
        <h2>随便翻翻</h2>
        <p>从各路主题里随机捞了几条，点开看看详情；不喜欢这波，点「换一批」再来。</p>
      </div>
      <button class="refresh-btn" id="refreshFeatured">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.22-8.56"/><path d="M21 3v6h-6"/></svg>
        换一批
      </button>
    </div>
    <div class="featured-grid" id="featuredGrid"></div>
    <!-- 查看全部按钮 -->
    <div class="view-all-bar" id="viewAllBar">
      <a href="gallery.html?cat=全部" class="view-all-btn">
        查看全部
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </div>
  </section>
</main>
<script src="js/base.js?v=38"></script>
<script src="js/features-classic.js?v=38"></script>
<script src="js/home.js?v=38"></script>
</body>
</html>
