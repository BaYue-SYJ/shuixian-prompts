<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>详情 · 水仙的AI提示词</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://r2.qqsrc.com" crossorigin>
<link rel="dns-prefetch" href="https://r2.qqsrc.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css?v=43">
<link rel="stylesheet" href="css/features.css?v=43">
<style>
.detail-panel{display:grid;grid-template-columns:1.05fr .95fr;gap:0;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);margin-top:8px}
.detail-img{position:relative;background:var(--surface-2);min-height:460px;display:grid;place-items:center;
  overflow:auto;max-height:88vh;padding:18px;align-self:start}   /* start：不被右侧长正文拉高 */
.detail-img .ph{position:absolute;inset:0}
.detail-img .ph-img{position:static;inset:auto;width:auto;max-width:100%;max-height:calc(88vh - 36px);
  height:auto;object-fit:contain;display:block;border-radius:14px;box-shadow:var(--shadow)}
.detail-img .wm{position:absolute;font-family:var(--serif);font-weight:900;font-size:130px;color:rgba(255,255,255,.35);mix-blend-mode:overlay}
/* 正文列：高度由 JS 跟图片列同步（不高于图片）。
   滚动条收进「提示词框」内部，标题/按钮/提示文字固定不动 —— 按钮永不被滚动内容遮住。 */
.detail-body{padding:34px 36px;display:flex;flex-direction:column;gap:16px;
  min-height:0;overflow-y:auto;overscroll-behavior:contain}
.detail-body > *{flex:none}
.detail-body > .lb-prompt{flex:1 1 auto;min-height:110px;overflow-y:auto;
  overscroll-behavior:contain;scrollbar-gutter:stable}
@media(max-width:780px){.detail-panel{grid-template-columns:1fr}.detail-img{min-height:260px}
  /* 窄屏是上下堆叠，正文按自然高度展开，提示词框也不再内层滚动 */
  .detail-body{max-height:none!important;overflow:visible}
  .detail-body > .lb-prompt{min-height:0;overflow:visible}}
</style>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/icon-32.png?v=1">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png?v=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2C8CAB">
</head>
<body data-page="detail">
<main>
  <div class="shell">
    <div id="detailMount"></div>
  </div>
  <section class="sec" style="padding-top:30px"><div class="shell">
    <div class="sec-head"><div><p class="eyebrow">Related</p><h2 data-i18n="de_related">同类推荐</h2></div>
      <a data-i18n="de_more" class="link-more" id="moreCat" href="#">查看更多</a></div>
    <div class="masonry" id="related"></div>
  </div></section>
</main>
<script src="js/base.js?v=43"></script>
<script src="js/i18n.js?v=43"></script>
<script src="js/features.js?v=43"></script>
<script>
App.init({ page:'detail', onReady:function(){
  const D = App.D;
  const rawId = new URLSearchParams(location.search).get('id');
  // 先按对外连续编号解析，再回退内部 id（老链接继续可用）
  const hit = rawId ? App.resolveId(rawId) : null;
  const esc = t => (t == null ? '' : String(t)).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const T = (k, d) => (window.FX && FX.t) ? FX.t(k) : d;

  // 链接里的 id 不存在时，不再静默显示第一条（会让人误以为那就是该 ID 的内容）
  if (rawId !== null && rawId !== '' && !hit){
    $('#detailMount').innerHTML = `
      <a class="link-more" href="gallery.html" style="margin-bottom:14px;display:inline-flex">${esc(T('de_back', '← 返回画廊'))}</a>
      <div class="detail-panel" style="grid-template-columns:1fr">
        <div class="detail-body" style="align-items:flex-start;padding:56px 44px">
          <p class="eyebrow" style="margin:0">Not found</p>
          <h1 class="lb-title" style="margin:0">${esc(T('de_nf_title', '没有找到这条提示词'))}</h1>
          <p style="color:var(--muted);margin:0;max-width:560px">
            ID #${esc(rawId)} ${esc(T('de_nf_sub', '在数据集里不存在，可能已被移除，或链接里的编号有误。回画廊重新找，或用搜索框按关键词 / ID 搜索。'))}
          </p>
          <a class="btn btn-primary" href="gallery.html">${esc(T('de_nf_back', '返回画廊'))}</a>
        </div>
      </div>`;
    document.title = 'Not found · 水仙的AI提示词';
    setTimeout(() => { document.title = 'Not found · 水仙的AI提示词'; }, 80);   // 覆盖 applyI18n 的标题
    return;
  }

  let s = hit || D.samples[0];
  const { bg, main } = App.catColor(s.category);
  const wm = (s.category || '图').slice(0, 1);
  const heart = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.5-4.6-10-9.3C.3 8.4 2 5 5.3 5c2 0 3.4 1.2 4.7 3 1.3-1.8 2.7-3 4.7-3C18 5 19.7 8.4 22 11.7 19.5 16.4 12 21 12 21z"/></svg>`;

  function detailImgHTML(s){
    const hint = '<span class="load-hint">原图加载中，首次打开请稍候…</span>';
    return s.image
      ? `${hint}<img class="ph-img" src="${esc(App.imgUrl(s.image))}" alt="${esc(s.category)}" onload="this.previousElementSibling?.remove()">`
      : `<div class="ph" style="background:linear-gradient(140deg,${bg},${main})"></div><span class="wm">${esc(wm)}</span>`;
  }
  function tokPrompt(p){ return esc(p || FX.t('loading_dots')).replace(/(\{argument[^}]*\})/g, '<span class="tok">$1</span>'); }

  function build(){
    const tok = tokPrompt(s.prompt);
    $('#detailMount').innerHTML = `
      <a data-i18n="de_back" class="link-more" href="gallery.html" style="margin-bottom:14px;display:inline-flex">← 返回画廊</a>
      <div class="detail-panel">
        <div class="detail-img" id="dImg">${detailImgHTML(s)}</div>
        <div class="detail-body">
          <div class="lb-crumb"><a data-i18n="nav_gallery" href="gallery.html">画廊</a> › <a href="gallery.html?cat=${encodeURIComponent(s.category)}" style="color:${main}">${esc(FX.catName(s.category))}</a></div>
          <h1 class="lb-title">${esc(s.title)}</h1>
          <div class="lb-tags"><span class="tag cc" style="background:${bg};color:${main}">${esc(FX.catName(s.category))}</span><span class="tag">ID #${App.seqOf(s)}</span></div>
          <div class="lb-prompt" id="dPrompt">${tok}</div>
          <div class="lb-actions">
            <button class="btn btn-primary" id="copyBtn">${esc(FX.t('copy_prompt'))}</button>
            <button class="btn btn-soft fav-btn" data-id="${s.id}">${heart} ${esc(FX.t('fav_add'))}</button>
          </div>
          <p data-i18n="tip_detail_page" style="color:var(--muted);font-size:12.5px;margin:6px 0 0">提示：本页为灯箱详情的页面版；在画廊里点卡片可直接唤起全屏灯箱。</p>
        </div>
      </div>`;
    $('#copyBtn').addEventListener('click', () => App.copyText(s.prompt || ''));
    App.attachThumbs($('#dImg'), s);   // 多图：左下角缩略图切换
    const di = $('#dImg').querySelector('img');
    if (di) di.addEventListener('error', () => {
      di.remove();
      if (!$('#dImg').querySelector('.ph')) $('#dImg').insertAdjacentHTML('afterbegin', `<div class="ph" style="background:linear-gradient(140deg,${bg},${main})"></div><span class="wm">${esc(wm)}</span>`);
    });
    const fb = $('#detailMount').querySelector('.fav-btn');
    if (App.isFav(s.id)) fb.classList.add('on'), fb.innerHTML = heart + ' ' + esc(FX.t('fav_added'));
    fb.addEventListener('click', function(){ const on = App.toggleFav(s.id); this.classList.toggle('on', on); this.innerHTML = heart + ' ' + esc(on ? FX.t('fav_added') : FX.t('fav_add')); });
    $('#moreCat').href = 'gallery.html?cat=' + encodeURIComponent(s.category);
    const rel = D.samples.filter(x => x.category === s.category && x.id !== s.id).slice(0, 8);
    if (rel.length) App.renderCards(rel, $('#related')); else $('#related').innerHTML = '<div class="empty">' + esc(FX.t('empty_related')) + '</div>';
  }

  build();

  /* 正文高度跟随图片列：永远不超过图片高度，超出部分在正文列内滚动 */
  (function fitBodyToImage(){
    const bodyCol = $('#detailMount .detail-body');
    const imgCol = $('#dImg');
    if (!bodyCol || !imgCol) return;
    const sync = () => {
      // 窄屏是上下堆叠，交给 CSS（max-height:none）处理
      if (window.innerWidth <= 780){ bodyCol.style.maxHeight = ''; return; }
      const h = Math.round(imgCol.getBoundingClientRect().height);
      bodyCol.style.maxHeight = h > 0 ? h + 'px' : '';
    };
    sync();
    window.addEventListener('resize', sync);
    // 图片加载完 / 切换缩略图导致图片列高度变化时，重新对齐
    if (window.ResizeObserver) new ResizeObserver(sync).observe(imgCol);
    window.__syncDetailFit = sync;
  })();

  // 轻量数据无 prompt：按需补齐后刷新正文
  if (!s.prompt){
    App.ensureFull().then(() => {
      if (window.FX) FX.clearTagCache();
      const f = App.resolveId(rawId);
      if (f && f.prompt){ s = f; const p = $('#dPrompt'); if (p) p.innerHTML = tokPrompt(f.prompt); }
    });
  }
}});
</script>
</body>
</html>
