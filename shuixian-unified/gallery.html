<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画廊 · 水仙的AI提示词</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://r2.qqsrc.com" crossorigin>
<link rel="dns-prefetch" href="https://r2.qqsrc.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css?v=27">
<link rel="stylesheet" href="css/features.css?v=27">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2C8CAB">
<style>
.masonry.uniform{display:block}
.masonry.uniform .card{display:grid;grid-template-columns:200px 1fr;margin-bottom:14px}
.masonry.uniform .card .thumb{height:100%}
.masonry.uniform .card .thumb .ph{height:150px}
.masonry.uniform .card .body{justify-content:center}
@media(max-width:560px){.masonry.uniform .card{grid-template-columns:1fr}.masonry.uniform .card .thumb .ph{height:180px}}
</style>
</head>
<body data-page="gallery">
<main>
  <div class="page-head"><div class="shell">
    <p data-i18n="gal_eyebrow" class="eyebrow">Gallery</p>
    <h1 data-i18n="gal_h1">提示词画廊</h1>
    <p data-i18n="gal_sub" class="sub">按大类、小类筛选，或用关键词搜索（支持拼音首字母，如 <b>sbpk</b> → 赛博朋克）；点卡片看完整提示词，心仪的收进合集。</p>
  </div></div>

  <div class="shell">
    <div class="gallery-layout">
      <!-- FILTER RAIL -->
      <aside class="filter-rail" id="filterRail">
        <h4>全部分类</h4>
        <div class="filter-group" id="filterGroup"></div>
        <div style="margin-top:6px"><button data-i18n="gal_clear" class="chip" id="clearFilter">清除筛选</button></div>
      </aside>

      <!-- RESULTS -->
      <section>
        <!-- 分面标签块已按需求移除 -->
        <div class="gallery-bar">
          <span class="count" id="resultCount">—</span>
          <div class="nav-search" style="width:280px;height:44px;margin:0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M16 16L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="galSearch" type="text" placeholder="在结果里搜索…" data-i18n-placeholder="gal_search_ph" autocomplete="off">
          </div>
          <span class="spacer"></span>
          <div class="view-toggles" id="viewToggle">
            <button data-view="masonry" class="active" title="瀑布流" data-i18n-title="gal_view_masonry">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="10" rx="1.5"/><rect x="13" y="3" width="8" height="6" rx="1.5"/><rect x="13" y="11" width="8" height="10" rx="1.5"/><rect x="3" y="15" width="8" height="6" rx="1.5"/></svg></button>
            <button data-view="uniform" title="列表" data-i18n-title="gal_view_list">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="5" rx="1.5"/><rect x="3" y="11" width="18" height="5" rx="1.5"/><rect x="3" y="18" width="18" height="3" rx="1.5"/></svg></button>
          </div>
          <select class="sort-select" id="sortSel">
            <option data-i18n="gal_sort_latest" value="latest">最新</option>
            <option data-i18n="gal_sort_hot" value="hot">最热</option>
            <option data-i18n="gal_sort_random" value="random">随机</option>
          </select>
        </div>
        <div class="hl-legend" id="hlLegend" style="display:none"></div>
        <div class="masonry" id="grid"></div>
        <button data-i18n="gal_more" class="show-more" id="showMore">显示更多</button>
      </section>
    </div>
  </div>
</main>
<script src="js/base.js?v=27"></script>
<script src="js/i18n.js?v=27"></script>
<script src="js/features.js?v=27"></script>
<script>
App.init({ page:'gallery', onReady:function(){
  const D = App.D;
  const sub2maj = {};
  D.majors.forEach(m => m.subs.forEach(s => sub2maj[s.name] = m.name));
  const params = new URLSearchParams(location.search);
  let state = { cat: params.get('cat') || '全部', q: params.get('q') || '', sort:'random', view:'masonry', shown:24 };

  /* ---------- 左侧分类栏 ---------- */
  const MULTI = '多图';                 // 跨类标签：一条提示词带多张图，原分类不变
  const isMulti = App.isMulti;
  const multiCount = D.samples.filter(isMulti).length;
  const fg = $('#filterGroup');
  fg.innerHTML = `<div class="maj multi" data-maj="${MULTI}">
      <button type="button"><span>${FX.esc(FX.t('multi_tag'))} <span style="color:var(--muted);font-weight:500">· ${multiCount}</span></span></button>
    </div>` + D.majors.map(m => {
    // 没有子类的大类（如「New欧美」）：本身就是可点选的一级入口
    if (!m.subs.length) {
      return `<div class="maj leaf" data-maj="${m.name}">
        <button type="button"><span>${FX.esc(FX.catName(m.name))} <span style="color:var(--muted);font-weight:500">· ${m.count}</span></span></button>
      </div>`;
    }
    const open = (m.name === state.cat || sub2maj[state.cat] === m.name) ? 'open' : '';
    const activeSub = (sub2maj[state.cat] === m.name) ? state.cat : '';
    // data-cat / data-maj 保持中文原名（用于筛选与 URL），只有显示文字走翻译
    const subs = m.subs.map(s => `<button data-cat="${s.name}" class="${s.name === activeSub ? 'active' : ''}">${FX.esc(FX.catName(s.name))}<span class="n">${s.count}</span></button>`).join('');
    return `<div class="maj ${open}" data-maj="${m.name}">
      <button><span>${FX.esc(FX.catName(m.name))} <span style="color:var(--muted);font-weight:500">· ${m.count}</span></span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="sublist">${subs}</div></div>`;
  }).join('');
  // 一级可点选入口（多图 / 无子类的大类）
  fg.querySelectorAll('.maj.multi>button, .maj.leaf>button').forEach(b => b.addEventListener('click', () => {
    state.cat = b.parentElement.dataset.maj; state.shown = 24; syncFilterUI(); refreshAll();
  }));
  fg.querySelectorAll('.maj:not(.multi):not(.leaf)>button').forEach(b => b.addEventListener('click', () => b.parentElement.classList.toggle('open')));
  fg.querySelectorAll('.sublist button').forEach(b => b.addEventListener('click', () => {
    state.cat = b.dataset.cat; state.shown = 24; syncFilterUI(); refreshAll();
  }));

  function syncFilterUI(){
    fg.querySelectorAll('.maj.multi>button, .maj.leaf>button').forEach(b => {
      b.classList.toggle('active', b.parentElement.dataset.maj === state.cat);
    });
    fg.querySelectorAll('.maj:not(.multi):not(.leaf)').forEach(mj => {
      const open = (mj.dataset.maj === state.cat || sub2maj[state.cat] === mj.dataset.maj);
      mj.classList.toggle('open', open);
      mj.querySelectorAll('.sublist button').forEach(b => b.classList.toggle('active', b.dataset.cat === state.cat));
    });
  }

  /* ---------- 数据池 / 筛选 ---------- */
  // 分面计数用：当前分类下的池子（不含关键词与标签筛选）
  function basePool(){
    let list = D.samples.slice();
    if (state.cat !== '全部'){
      if (state.cat === MULTI) list = list.filter(isMulti);
      // 大类名或小类名都能筛：小类精确匹配，大类含其全部子类
      else list = list.filter(s => s.category === state.cat || sub2maj[s.category] === state.cat);
    }
    return list;
  }
  window.__fxFacetPool = basePool;

  let rndSeed = Math.random();
  function filtered(){
    let list = basePool();
    if (state.q) list = FX.smartSearch(list, state.q);
    list = FX.applyFilters(list);
    if (state.sort === 'hot') list.sort((a,b) => b.likes - a.likes);
    else if (state.sort === 'random') list.sort((a,b) => (a.id * rndSeed) % 1 - (b.id * rndSeed) % 1);
    else list.sort((a,b) => b.id - a.id);
    return list;
  }

  function render(append){
    const list = filtered();
    $('#resultCount').textContent = FX.tf('gal_count', { n: list.length });
    const slice = list.slice(0, state.shown);
    App.renderCards(slice, $('#grid'), { append: !!append });
    $('#showMore').style.display = list.length > state.shown ? 'block' : 'none';
    const lg = $('#hlLegend');
    if (lg){
      if (state.q){
        lg.style.display = 'block';
        lg.innerHTML = FX.tf('gal_legend', { q: FX.esc(state.q) });
      } else lg.style.display = 'none';
    }
  }
  function refreshAll(){
    FX.setQuery(state.q);
    if (window.__fxRebuildFacets) window.__fxRebuildFacets();
    render();
  }
  window.__fxGalleryRefresh = function(){ state.shown = 24; render(); };

  /* ---------- 交互 ---------- */
  const gs = $('#galSearch');
  gs.value = state.q;
  gs.addEventListener('input', e => { state.q = e.target.value.trim(); refreshAll(); });
  $('#sortSel').addEventListener('change', e => { state.sort = e.target.value; if (state.sort === 'random') rndSeed = Math.random(); render(); });
  $('#viewToggle').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    state.view = b.dataset.view;
    $('#viewToggle').querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
    $('#grid').classList.toggle('uniform', state.view === 'uniform');
  }));
  $('#clearFilter').addEventListener('click', () => {
    state.cat = '全部'; state.q = ''; gs.value = ''; state.shown = 24;
    FX.filters.facets = {}; FX.filters.hasImage = false; FX.filters.favOnly = false;
    syncFilterUI(); refreshAll();
  });
  $('#showMore').addEventListener('click', () => { state.shown += 24; render(true); });

  syncFilterUI();
  $('#sortSel').value = state.sort;   // 默认随机：下拉框同步选中「随机」
  // features.js 会在 sx:ready 时注入分面宿主；这里首帧后主动建一次
  setTimeout(() => { if (window.__fxRebuildFacets) refreshAll(); }, 0);
  render();

  App.ensureFull();
  window.__onFullLoaded = function(){
    FX.clearTagCache();
    if (window.__fxRebuildFacets) window.__fxRebuildFacets();
    render();
  };
}});
</script>
</body>
</html>
