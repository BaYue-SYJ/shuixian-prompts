<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赞赏 · 水仙的AI提示词</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://r2.qqsrc.com" crossorigin>
<link rel="dns-prefetch" href="https://r2.qqsrc.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css?v=17">
<link rel="stylesheet" href="css/features.css?v=17">
<style>
.sponsor-wrap{max-width:640px;margin:0 auto;text-align:center}
.sponsor-card{background:linear-gradient(135deg,var(--daffodil),var(--daffodil-050));border-radius:var(--radius-lg);padding:36px 30px;box-shadow:var(--shadow);color:#08242D}
.sponsor-card h2{font-family:var(--serif);font-size:26px;margin:0 0 10px}
.sponsor-card p{opacity:.9;margin:0 0 24px;line-height:1.7}
.qr-box{display:inline-block;background:#fff;padding:16px;border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.qr-box img{width:220px;height:220px;display:block;border-radius:8px}
.qr-box .cap{margin-top:10px;color:#333;font-weight:600;font-size:14px}
.alt{margin-top:26px;color:var(--muted);font-size:14px;line-height:1.8}
.alt a{color:var(--garden);font-weight:600}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2C8CAB">
</head>
<body data-page="sponsor">
<main>
  <div class="page-head"><div class="shell" style="text-align:center">
    <p data-i18n="sp_eyebrow" class="eyebrow">Sponsor</p>
    <h1 data-i18n="sp_h1">请作者喝杯咖啡</h1>
    <p data-i18n="sp_sub" class="sub">你的支持，是水仙持续更新的动力 ☕</p>
  </div></div>

  <section class="sec"><div class="shell">
    <div class="sponsor-wrap">
      <div class="sponsor-card">
        <h2 data-i18n="sp_h2">赞赏水仙 🌼</h2>
        <p data-i18n="sp_p">整理 5,452 条提示词、维护这个花园花了不少心思。如果它帮到了你，欢迎量力赞赏，让花园长得更久。</p>
        <div class="qr-box">
          <img src="images/wechat-kas2026.jpg" alt="微信赞赏码">
          <div class="cap">微信扫一扫 · 赞赏作者</div>
        </div>
      </div>
      <p data-i18n="sp_alt" class="alt">没有微信也没关系，欢迎在 <a href="about.html#contact">关于页</a> 找到我们，或去 <a data-i18n="nav_submit" href="submit.html">投稿</a> 用一条好提示词来支持——那同样是很暖的鼓励。</p>
    </div>
  </div></section>
</main>
<script src="js/base.js?v=17"></script>
<script src="js/i18n.js?v=17"></script>
<script src="js/features.js?v=17"></script>
<script>App.init({ page:'sponsor' });</script>
</body>
</html>
